services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ebazaar
      POSTGRES_USER: ebazaar
      POSTGRES_PASSWORD: ebazaar-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebazaar -d ebazaar"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: "development-compose-secret-change-before-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
      DATABASE_URL: "postgresql://ebazaar:ebazaar-dev-only@db:5432/ebazaar"
    volumes:
      - media_data:/app/ECommerce/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_data:
